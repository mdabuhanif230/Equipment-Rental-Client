<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Power drill illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#dfe7ea"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12a594"/>
      <stop offset="1" stop-color="#0b6e65"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="210" fill="#ffffff" opacity="0.65"/>
  <circle cx="400" cy="300" r="210" fill="none" stroke="#0d7a6f" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="14 12"/>

  <!-- drill -->
  <g transform="translate(250 210)">
    <rect x="40" y="40" width="250" height="110" rx="34" fill="url(#tool)"/>
    <rect x="40" y="74" width="250" height="18" fill="#04211d" opacity="0.18"/>
    <rect x="286" y="66" width="74" height="58" rx="18" fill="#0b4a45"/>
    <rect x="352" y="80" width="56" height="30" rx="8" fill="#94a3b8"/>
    <rect x="404" y="88" width="34" height="14" rx="6" fill="#64748b"/>
    <path d="M96 150 h96 l-26 150 h-70 z" fill="#0b6e65"/>
    <rect x="86" y="262" width="126" height="74" rx="20" fill="#0d7a6f"/>
    <rect x="86" y="292" width="126" height="16" fill="#04211d" opacity="0.2"/>
    <rect x="60" y="60" width="46" height="64" rx="14" fill="#f59e0b"/>
    <circle cx="200" cy="96" r="18" fill="#fde68a"/>
  </g>

  <!-- floating bits -->
  <g stroke="#0d7a6f" stroke-width="9" stroke-linecap="round" opacity="0.55">
    <path d="M170 470 h56"/>
    <path d="M580 470 h56"/>
    <path d="M600 150 h44"/>
  </g>
</svg>
