<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1080" width="800" height="1080" role="img" aria-label="Illustration of organized rental tools on warehouse shelving">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#062523"/>
      <stop offset="0.6" stop-color="#08202a"/>
      <stop offset="1" stop-color="#050d15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#12a594" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14524c"/>
      <stop offset="1" stop-color="#0b3733"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1080" fill="url(#bg)"/>
  <rect width="800" height="1080" fill="url(#grid)"/>
  <rect width="800" height="1080" fill="url(#glow)"/>

  <!-- shelving unit -->
  <g>
    <rect x="90" y="150" width="620" height="760" rx="26" fill="none" stroke="#1f8f83" stroke-width="7" opacity="0.7"/>
    <g fill="url(#shelf)">
      <rect x="110" y="380" width="580" height="26" rx="10"/>
      <rect x="110" y="610" width="580" height="26" rx="10"/>
      <rect x="110" y="840" width="580" height="26" rx="10"/>
    </g>

    <!-- top shelf: hard hat + boxes -->
    <g>
      <path d="M170 350 a56 56 0 0 1 112 0 z" fill="#f59e0b"/>
      <rect x="158" y="344" width="136" height="14" rx="7" fill="#d97706"/>
      <rect x="330" y="270" width="130" height="110" rx="12" fill="#0d7a6f"/>
      <rect x="330" y="300" width="130" height="16" fill="#04211d" opacity="0.35"/>
      <rect x="490" y="300" width="150" height="80" rx="12" fill="#0a3f3a"/>
      <rect x="516" y="322" width="98" height="14" rx="7" fill="#7dd3fc" opacity="0.7"/>
    </g>

    <!-- middle shelf: power drill + saw + case -->
    <g>
      <rect x="150" y="520" width="150" height="52" rx="16" fill="#0d7a6f"/>
      <rect x="176" y="566" width="44" height="44" rx="10" fill="#0b4a45"/>
      <rect x="292" y="534" width="76" height="24" rx="12" fill="#7dd3fc" opacity="0.8"/>
      <circle cx="380" cy="546" r="44" fill="none" stroke="#f59e0b" stroke-width="14"/>
      <path d="M380 502 v-26 M380 590 v26 M336 546 h-26 M424 546 h26" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
      <rect x="470" y="500" width="170" height="110" rx="14" fill="#0a3f3a"/>
      <rect x="500" y="540" width="110" height="18" rx="9" fill="#12a594"/>
      <rect x="536" y="570" width="38" height="14" rx="7" fill="#f59e0b"/>
    </g>

    <!-- bottom shelf: ladder + toolbox -->
    <g>
      <g stroke="#7dd3fc" stroke-width="12" stroke-linecap="round" opacity="0.85">
        <path d="M150 840 V690"/>
        <path d="M214 840 V690"/>
        <path d="M150 720h64 M150 756h64 M150 792h64 M150 828h64"/>
      </g>
      <rect x="300" y="756" width="210" height="84" rx="14" fill="#0d7a6f"/>
      <rect x="300" y="784" width="210" height="16" fill="#04211d" opacity="0.3"/>
      <path d="M356 756 a50 34 0 0 1 98 0" fill="none" stroke="#0b4a45" stroke-width="14"/>
      <rect x="546" y="740" width="104" height="100" rx="12" fill="#0a3f3a"/>
      <circle cx="598" cy="790" r="26" fill="none" stroke="#f59e0b" stroke-width="10"/>
    </g>
  </g>

  <!-- hanging work light -->
  <g opacity="0.9">
    <path d="M640 60 v70" stroke="#1f8f83" stroke-width="6"/>
    <path d="M604 130 h72 l-18 44 h-36 z" fill="#f59e0b"/>
    <circle cx="640" cy="186" r="16" fill="#fde68a"/>
  </g>

  <!-- foreground reflection -->
  <rect y="960" width="800" height="120" fill="#04090f" opacity="0.75"/>
</svg>
