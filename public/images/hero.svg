<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Illustration of an excavator and machinery in an industrial yard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04211d"/>
      <stop offset="0.55" stop-color="#062523"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.32" r="0.62">
      <stop offset="0" stop-color="#12a594" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#12a594" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.9" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a22"/>
      <stop offset="1" stop-color="#04090f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8f83"/>
      <stop offset="1" stop-color="#0d5f57"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#amber)"/>

  <!-- horizon / yard floor -->
  <rect y="700" width="1600" height="200" fill="url(#ground)"/>
  <path d="M0 700H1600" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
    <path d="M120 790h140"/>
    <path d="M330 790h90"/>
    <path d="M470 790h180"/>
  </g>

  <!-- large decorative gear (top right) -->
  <g opacity="0.16" transform="translate(1290 250)">
    <g fill="#7dd3fc">
      <rect x="-30" y="-186" width="60" height="66" rx="12"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(45)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(90)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(135)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(180)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(225)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(270)"/>
      <rect x="-30" y="-186" width="60" height="66" rx="12" transform="rotate(315)"/>
    </g>
    <circle r="132" fill="#0d7a6f" stroke="#7dd3fc" stroke-width="10"/>
    <circle r="52" fill="#04211d"/>
  </g>

  <!-- excavator -->
  <g>
    <!-- boom, arm, bucket -->
    <path d="M1180 560 L1330 430" stroke="url(#steel)" stroke-width="46" stroke-linecap="round" fill="none"/>
    <path d="M1330 430 L1450 520" stroke="url(#steel)" stroke-width="38" stroke-linecap="round" fill="none"/>
    <path d="M1450 520 l60 12 -18 66 -78 -22 z" fill="#f59e0b"/>
    <path d="M1450 520 l60 12" stroke="#0a1420" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1330" cy="430" r="17" fill="#0a1420"/>
    <circle cx="1180" cy="560" r="17" fill="#0a1420"/>

    <!-- house / cab -->
    <rect x="1040" y="520" width="260" height="132" rx="20" fill="url(#steel)"/>
    <path d="M1040 540h-46l-14 96 60 4z" fill="#0d5f57"/>
    <rect x="1078" y="438" width="140" height="98" rx="16" fill="#0d5f57"/>
    <rect x="1094" y="454" width="108" height="66" rx="10" fill="#7dd3fc" opacity="0.85"/>
    <rect x="1196" y="546" width="86" height="14" rx="7" fill="#f59e0b" opacity="0.9"/>
    <circle cx="1160" cy="596" r="26" fill="#04211d" opacity="0.55"/>

    <!-- tracks -->
    <rect x="960" y="646" width="360" height="86" rx="43" fill="#0a1420" stroke="#1f8f83" stroke-width="5"/>
    <g fill="#123a3a">
      <circle cx="1010" cy="689" r="24"/>
      <circle cx="1090" cy="689" r="24"/>
      <circle cx="1170" cy="689" r="24"/>
      <circle cx="1250" cy="689" r="24"/>
    </g>
    <g fill="#04211d">
      <circle cx="1010" cy="689" r="9"/>
      <circle cx="1090" cy="689" r="9"/>
      <circle cx="1170" cy="689" r="9"/>
      <circle cx="1250" cy="689" r="9"/>
    </g>
  </g>

  <!-- secondary machine silhouette (left, faint) -->
  <g opacity="0.35">
    <rect x="300" y="588" width="150" height="76" rx="14" fill="#0d5f57"/>
    <rect x="326" y="536" width="74" height="56" rx="12" fill="#0d5f57"/>
    <rect x="276" y="660" width="200" height="44" rx="22" fill="#0a1420"/>
    <path d="M450 606 L540 556" stroke="#0d5f57" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="560" cy="546" r="14" fill="#f59e0b" opacity="0.7"/>
  </g>

  <!-- floating dots -->
  <g fill="#7dd3fc" opacity="0.5">
    <circle cx="760" cy="220" r="5"/>
    <circle cx="840" cy="300" r="3"/>
    <circle cx="640" cy="330" r="4"/>
    <circle cx="960" cy="180" r="3.5"/>
    <circle cx="480" cy="240" r="3"/>
  </g>
</svg>
